name: Autograding
on: [push, workflow_dispatch]
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - id: robots
        uses: classroom-resources/autograding-command-grader@v1
        with: {test-name: "1 robots.txt", command: "pytest tests/test_1_robots.py", timeout: 5, max-score: 15}
      - id: wallet
        uses: classroom-resources/autograding-command-grader@v1
        with: {test-name: "2 wallet", command: "pytest tests/test_2_wallet.py", timeout: 5, max-score: 25}
      - id: llm
        uses: classroom-resources/autograding-command-grader@v1
        with: {test-name: "3 llm runtime", command: "pytest tests/test_3_llm_runtime.py", timeout: 5, max-score: 25}
      - id: stats
        uses: classroom-resources/autograding-command-grader@v1
        with: {test-name: "4 stats", command: "pytest tests/test_4_stats.py", timeout: 5, max-score: 15}
      - id: passport
        uses: classroom-resources/autograding-command-grader@v1
        with: {test-name: "5 passport", command: "pytest tests/test_5_passport.py", timeout: 5, max-score: 10}
      - uses: classroom-resources/autograding-grading-reporter@v1
        env:
          ROBOTS_RESULTS: "${{steps.robots.outputs.result}}"
          WALLET_RESULTS: "${{steps.wallet.outputs.result}}"
          LLM_RESULTS: "${{steps.llm.outputs.result}}"
          STATS_RESULTS: "${{steps.stats.outputs.result}}"
          PASSPORT_RESULTS: "${{steps.passport.outputs.result}}"
        with:
          runners: robots,wallet,llm,stats,passport
